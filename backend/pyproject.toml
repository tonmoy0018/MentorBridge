[project]
name = "mentorbridge-backend"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hard-coded test passwords

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
# --ds wins over a DJANGO_SETTINGS_MODULE env var (docker compose sets the dev module).
addopts = "--ds=config.settings.test --strict-markers -q"
