  /api/v1/admin/payments/{id}/refund/:
    post:
      operationId: admin_payments_refund_create
      description: Full refund of what remains, or a partial `amount_cents`. Executed
        through the provider (idempotent per refund) and audit-logged. The refund
        is `pending` until the provider confirms it.
      summary: Refund a captured payment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefundRequestRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error (`validation_error`); field errors in `details.fields`.
        '401':
