openapi: 3.0.3
info:
  title: MentorBridge API
  version: 1.0.0
  description: 'REST API for the MentorBridge mentorship marketplace. Authentication
    uses the Django session cookie; unsafe requests must send the `X-CSRFToken` header
    (obtain the cookie from `GET /api/v1/auth/csrf/`). Errors use the envelope `{"error":
    {"code", "message", "details"}}`.'
paths:
  /api/v1/admin/audit-log/:
    get:
      operationId: admin_audit_log_list
      summary: Audit log
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - Admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogEntryList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not logged in (`not_authenticated`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Wrong role or CSRF failure (`permission_denied`, `csrf_failed`).
  /api/v1/admin/bookings/:
    get:
      operationId: admin_bookings_list
      summary: List all bookings
      parameters:
      - in: query
        name: mentor
        schema:
          type: string
        description: Mentor profile UUID
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - confirmed
          - declined
          - expired
          - pending_payment
          - requested
      - in: query
        name: student
        schema:
          type: string
        description: Student user UUID
      tags:
      - Admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not logged in (`not_authenticated`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Wrong role or CSRF failure (`permission_denied`, `csrf_failed`).
  /api/v1/admin/bookings/{id}/:
    get:
      operationId: admin_bookings_retrieve
      summary: Get any booking
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not logged in (`not_authenticated`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Wrong role or CSRF failure (`permission_denied`, `csrf_failed`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found, or not visible to you (`not_found`).
  /api/v1/admin/bookings/{id}/cancel/:
    post:
      operationId: admin_bookings_cancel_create
      description: Releases any uncaptured authorisation; refunds a captured payment
        in full when `refund` is true. Both participants are emailed. Audit-logged.
      summary: Cancel any active booking
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCancelRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error (`validation_error`); field errors in `details.fields`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not logged in (`not_authenticated`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Wrong role or CSRF failure (`permission_denied`, `csrf_failed`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found, or not visible to you (`not_found`).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflicts with the current state (e.g. `slot_unavailable`,
            `invalid_state`).
