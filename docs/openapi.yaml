      - provider_fees
      - refunds
    Profession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        industry:
          type: string
          readOnly: true
      required:
      - id
      - industry
      - name
      - slug
    PublicConfig:
      type: object
