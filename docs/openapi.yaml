    CreateBookingRequest:
      type: object
      description: The client chooses a service and a start time. Price and duration
        always come from the server.
      properties:
        service_id:
          type: string
          format: uuid
        start_at:
          type: string
          format: date-time
        student_note:
          type: string
          default: ''
          maxLength: 1000
      required:
      - service_id
      - start_at
    CreateReviewRequest:
      type: object
      properties:
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          default: ''
          maxLength: 2000
      required:
      - rating
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        timezone:
          type: string
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        is_admin:
          type: boolean
          readOnly: true
          description: True when the account may use admin endpoints (role=admin and
            staff).
      required:
      - email
      - email_verified
      - first_name
      - id
      - is_admin
      - last_name
      - role
      - timezone
    DisputeStatusEnum:
      enum:
      - none
      - open
      - won
      - lost
      type: string
      description: |-
        * `none` - No dispute
        * `open` - Dispute open
        * `won` - Dispute won
        * `lost` - Dispute lost
    DurationMinutesEnum:
      enum:
      - 15
      - 30
      - 45
      - 60
      - 90
      - 120
      - 180
      type: integer
      description: |-
        * `15` - 15
        * `30` - 30
        * `45` - 45
        * `60` - 60
        * `90` - 90
        * `120` - 120
        * `180` - 180
    EarningsSummary:
      type: object
      properties:
        pending:
          $ref: '#/components/schemas/Money'
        available:
          $ref: '#/components/schemas/Money'
        paid_out:
          $ref: '#/components/schemas/Money'
        lifetime:
          $ref: '#/components/schemas/Money'
      required:
      - available
      - lifetime
      - paid_out
      - pending
    EmailVerifyRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 64
        token:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - token
      - uid
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
      - code
      - details
      - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    Experience:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/ExperienceKindEnum'
        title:
          type: string
          maxLength: 120
        organization:
          type: string
          maxLength: 120
        start_date:
          type: string
          format: date
