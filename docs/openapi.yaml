  /api/v1/admin/stats/:
    get:
      operationId: admin_stats_retrieve
      description: 'Counts are totals; `period` covers `from`..`to` (UTC dates, inclusive,
        default the last 30 days). Money is split into `live` and `test`: test-mode
        (sandbox) payments are never revenue. `gross_booking_value`, `platform_fees`
        and `refunds` at the top level are live totals.'
      summary: Marketplace statistics
      parameters:
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
      tags:
