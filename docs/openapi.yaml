    AvailabilityRuleRequest:
      type: object
      properties:
        weekday:
          type: integer
          maximum: 6
          minimum: 0
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
      required:
      - end_time
      - start_time
      - weekday
    BlankEnum:
