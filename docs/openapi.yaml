  /api/v1/bookings/:
    get:
      operationId: bookings_list
      description: Students see their bookings; mentors see bookings with them. `scope=upcoming`
        returns active bookings that haven't ended; `past` returns ended or closed
        ones.
      summary: List my bookings
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: scope
        schema:
          enum:
          - upcoming
          - past
          - all
          type: string
          default: all
          minLength: 1
        description: |-
          * `upcoming` - upcoming
          * `past` - past
          * `all` - all
      - in: query
        name: status
        schema:
          type: array
          items:
            enum:
            - pending_payment
            - requested
            - confirmed
            - completed
            - declined
            - cancelled
            - expired
            type: string
            description: |-
              * `pending_payment` - Awaiting payment
              * `requested` - Awaiting mentor
              * `confirmed` - Confirmed
              * `completed` - Completed
              * `declined` - Declined
              * `cancelled` - Cancelled
              * `expired` - Expired
      tags:
      - Bookings
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
        '400':
