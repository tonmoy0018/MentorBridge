  /api/v1/mentors/:
    get:
      operationId: mentors_list
      description: Only mentors approved through verification (and with an active
        account) are listed. `price_min`/`price_max` compare against the mentor's
        lowest active service price, in cents. `available_within_days` keeps mentors
        with an open slot in that many days.
      summary: Search approved mentors
      parameters:
      - in: query
        name: available_within_days
        schema:
          type: integer
          maximum: 60
          minimum: 1
      - in: query
        name: country
        schema:
          type: string
          minLength: 1
          pattern: ^[A-Za-z]{2}$
      - in: query
        name: industry
        schema:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
            pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: language
        schema:
          type: string
          minLength: 1
          pattern: ^[a-z]{2,3}$
      - in: query
        name: ordering
        schema:
          enum:
          - relevance
          - min_price_cents
          - -min_price_cents
          - -rating_avg
          - -years_experience
          type: string
          minLength: 1
        description: |-
          * `relevance` - relevance
          * `min_price_cents` - min_price_cents
          * `-min_price_cents` - -min_price_cents
          * `-rating_avg` - -rating_avg
          * `-years_experience` - -years_experience
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: price_max
        schema:
          type: integer
          minimum: 0
        description: Cents
      - in: query
        name: price_min
        schema:
          type: integer
          minimum: 0
        description: Cents
      - in: query
        name: profession
        schema:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
      - in: query
        name: skill
        schema:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
            pattern: ^[-a-zA-Z0-9_]+$
      tags:
      - Mentors
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMentorSummaryList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error (`validation_error`); field errors in `details.fields`.
