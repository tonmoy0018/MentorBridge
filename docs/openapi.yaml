      - booking_hold_minutes
      - currency
      - free_cancellation_hours
      - mentor_response_hours
      - payments_enabled
      - payments_livemode
      - require_verified_email
    ReasonRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
    Refund:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        payment_id:
          type: string
          format: uuid
          readOnly: true
        booking_id:
          type: string
          format: uuid
          readOnly: true
        amount:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        commission_reversed:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        mentor_share_reversed:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/RefundReasonEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RefundRecordStatusEnum'
          readOnly: true
        provider_reference:
          type: string
          readOnly: true
          nullable: true
        failure_code:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        initiated_by_name:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - booking_id
      - commission_reversed
      - created_at
      - failure_code
      - id
      - initiated_by_name
      - mentor_share_reversed
      - note
      - payment_id
      - provider_reference
      - reason
      - status
      - updated_at
    RefundOutcomeEnum:
      enum:
      - not_charged
      - full_refund
      - no_refund
      type: string
      description: |-
        * `` - Not applicable
        * `not_charged` - Not charged
        * `full_refund` - Full refund
        * `no_refund` - No refund
    RefundReasonEnum:
      enum:
      - student_cancellation
      - mentor_cancellation
      - admin
      - dispute_lost
      - system
      type: string
      description: |-
        * `student_cancellation` - Student cancelled
        * `mentor_cancellation` - Mentor cancelled
        * `admin` - Issued by an administrator
        * `dispute_lost` - Dispute lost
        * `system` - Automatic: the booking couldn't go ahead
    RefundRecordStatusEnum:
      enum:
      - pending
      - succeeded
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `succeeded` - Succeeded
        * `failed` - Failed
    RefundStatusEnum:
      enum:
      - none
      - pending
      - partial
      - full
      - failed
      type: string
      description: |-
        * `none` - No refund
        * `pending` - Refund pending
        * `partial` - Partly refunded
        * `full` - Refunded
        * `failed` - Refund failed
