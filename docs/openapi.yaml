      - cancelled_at
      - completed_at
      - confirmed_at
      - created_at
      - duration_minutes
      - end_at
      - events
      - has_review
      - hold_expires_at
      - id
      - meeting_url
      - mentor
      - price
      - refund_outcome
      - respond_by
      - service_title
      - start_at
      - status
      - student
      - student_note
    BookingEvent:
      type: object
      properties:
        from_status:
          type: string
          maxLength: 20
        to_status:
          type: string
          maxLength: 20
        note:
          type: string
          maxLength: 1000
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - from_status
      - note
      - to_status
    BookingMentor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
        slug:
          type: string
        headline:
          type: string
      required:
      - avatar_url
      - display_name
      - headline
      - id
      - slug
    BookingParty:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
      required:
      - avatar_url
      - display_name
      - id
    BookingStatusCounts:
      type: object
      properties:
        pending_payment:
          type: integer
        requested:
          type: integer
        confirmed:
          type: integer
        completed:
          type: integer
        declined:
          type: integer
        cancelled:
          type: integer
        expired:
          type: integer
      required:
      - cancelled
      - completed
      - confirmed
      - declined
      - expired
      - pending_payment
      - requested
    BookingStatusEnum:
      enum:
      - pending_payment
      - requested
      - confirmed
      - completed
      - declined
      - cancelled
      - expired
      type: string
      description: |-
        * `pending_payment` - Awaiting payment
        * `requested` - Awaiting mentor
        * `confirmed` - Confirmed
        * `completed` - Completed
        * `declined` - Declined
        * `cancelled` - Cancelled
        * `expired` - Expired
    CareerGoal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 140
        description:
          type: string
          maxLength: 1000
        status:
          $ref: '#/components/schemas/GoalStatusEnum'
        target_date:
          type: string
          format: date
          nullable: true
        achieved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - achieved_at
      - created_at
      - description
      - id
      - status
      - target_date
      - title
    CareerGoalRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 140
        description:
          type: string
          maxLength: 1000
        status:
          $ref: '#/components/schemas/GoalStatusEnum'
        target_date:
          type: string
          format: date
          nullable: true
      required:
      - title
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        mentor_count:
          type: integer
          readOnly: true
      required:
      - description
      - id
      - is_active
      - name
      - slug
    Checkout:
      type: object
      properties:
        payment_id:
          type: string
          format: uuid
        checkout_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        livemode:
          type: boolean
          description: False when the provider is in test/sandbox mode.
      required:
      - checkout_url
      - expires_at
      - livemode
      - payment_id
