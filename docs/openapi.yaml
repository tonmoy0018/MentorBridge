components:
  schemas:
    AdminCancelRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        refund:
          type: boolean
          default: true
          description: Refund a captured payment in full. Ignored for unpaid bookings.
      required:
      - reason
    AdminNotification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        template:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AdminNotificationStatusEnum'
          readOnly: true
        attempts:
          type: integer
          readOnly: true
        last_error:
          type: string
          readOnly: true
          description: Exception type only, never content.
        recipient_name:
          type: string
          readOnly: true
        sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempts
      - created_at
      - id
      - last_error
      - recipient_name
      - sent_at
      - status
      - template
    AdminNotificationStatusEnum:
      enum:
      - queued
      - sent
      - failed
      - skipped
      type: string
      description: |-
        * `queued` - Queued
        * `sent` - Sent
        * `failed` - Failed
        * `skipped` - Skipped
    AdminPayment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking_id:
          type: string
          format: uuid
        student_display_name:
          type: string
        mentor_display_name:
          type: string
        amount:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        commission_bps:
          type: integer
          readOnly: true
          description: Platform commission in basis points (1500 = 15%).
        platform_fee:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        mentor_share:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        provider_fee:
          allOf:
          - $ref: '#/components/schemas/Money'
          nullable: true
          readOnly: true
        refunded:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        refundable:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
        refund_status:
          allOf:
          - $ref: '#/components/schemas/RefundStatusEnum'
          readOnly: true
        dispute_status:
          allOf:
          - $ref: '#/components/schemas/DisputeStatusEnum'
          readOnly: true
        provider:
          type: string
          readOnly: true
        provider_reference:
          type: string
          readOnly: true
          nullable: true
          description: Provider payment id (e.g. a Stripe PaymentIntent).
        livemode:
          type: boolean
          readOnly: true
          description: False for provider test/sandbox mode. Test payments are never
            revenue.
        failure_code:
          type: string
          readOnly: true
          description: Provider decline/error code only.
        created_at:
          type: string
          format: date-time
          readOnly: true
        captured_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - amount
      - booking_id
      - captured_at
      - commission_bps
      - created_at
      - dispute_status
      - failure_code
      - id
      - livemode
      - mentor_display_name
      - mentor_share
      - platform_fee
      - provider
      - provider_fee
      - provider_reference
      - refund_status
      - refundable
      - refunded
      - status
      - student_display_name
    AdminRefundRequestRequest:
      type: object
      properties:
        amount_cents:
          type: integer
          minimum: 1
          description: Omit for a full refund of what remains.
        note:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - note
    AdminReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        target_type:
          allOf:
          - $ref: '#/components/schemas/ReportTargetTypeEnum'
          readOnly: true
        target_id:
          type: string
          format: uuid
          readOnly: true
        target_label:
          type: string
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/ReportReasonEnum'
          readOnly: true
        details:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ReportStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        reporter_display_name:
          type: string
          readOnly: true
        resolution_note:
          type: string
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - details
      - id
      - reason
      - reporter_display_name
      - resolution_note
      - resolved_at
      - status
      - target_id
      - target_label
      - target_type
    AdminReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        rating:
          type: integer
          readOnly: true
        comment:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ReviewStatusEnum'
          readOnly: true
        hidden_reason:
          type: string
          readOnly: true
        reviewer_name:
          type: string
          readOnly: true
        mentor_name:
          type: string
          readOnly: true
        mentor_slug:
          type: string
          readOnly: true
        booking_id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - booking_id
      - comment
      - created_at
      - hidden_reason
      - id
      - mentor_name
      - mentor_slug
      - rating
      - reviewer_name
      - status
    AdminStats:
      type: object
      properties:
        users:
          $ref: '#/components/schemas/UserCounts'
        mentors_by_status:
          $ref: '#/components/schemas/MentorStatusCounts'
        bookings_by_status:
          $ref: '#/components/schemas/BookingStatusCounts'
        gross_booking_value:
          $ref: '#/components/schemas/Money'
        platform_fees:
          $ref: '#/components/schemas/Money'
        refunds:
          $ref: '#/components/schemas/Money'
        period:
          $ref: '#/components/schemas/StatsPeriod'
      required:
      - bookings_by_status
      - gross_booking_value
      - mentors_by_status
      - period
      - platform_fees
      - refunds
      - users
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - display_name
      - email
      - id
      - is_active
      - last_login
      - role
    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_name
      - created_at
      - id
      - metadata
      - target_id
      - target_type
    AvailabilityException:
