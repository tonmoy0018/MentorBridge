    Booking:
      type: object
      description: A booking as seen by its student, its mentor or an admin. No contact
        details are exposed.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        start_at:
          type: string
          format: date-time
          readOnly: true
        end_at:
          type: string
          format: date-time
          readOnly: true
        service_title:
          type: string
          readOnly: true
        duration_minutes:
          type: integer
          readOnly: true
        price:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        student_note:
          type: string
          readOnly: true
        meeting_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        mentor:
          allOf:
          - $ref: '#/components/schemas/BookingMentor'
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/BookingParty'
          readOnly: true
        hold_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        respond_by:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancellation_reason:
          type: string
          readOnly: true
        refund_outcome:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/RefundOutcomeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        has_review:
          type: boolean
          readOnly: true
          description: Whether the student has reviewed this booking.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cancellation_reason
      - cancelled_at
      - completed_at
      - confirmed_at
      - created_at
      - duration_minutes
      - end_at
      - has_review
      - hold_expires_at
      - id
      - meeting_url
      - mentor
      - price
      - refund_outcome
      - respond_by
      - service_title
      - start_at
      - status
      - student
      - student_note
    BookingDetail:
      type: object
      description: A booking as seen by its student, its mentor or an admin. No contact
        details are exposed.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        start_at:
          type: string
          format: date-time
          readOnly: true
        end_at:
          type: string
          format: date-time
          readOnly: true
        service_title:
          type: string
          readOnly: true
        duration_minutes:
          type: integer
          readOnly: true
        price:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        student_note:
          type: string
          readOnly: true
        meeting_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        mentor:
          allOf:
          - $ref: '#/components/schemas/BookingMentor'
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/BookingParty'
          readOnly: true
        hold_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        respond_by:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancellation_reason:
          type: string
          readOnly: true
        refund_outcome:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/RefundOutcomeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        has_review:
          type: boolean
          readOnly: true
          description: Whether the student has reviewed this booking.
        created_at:
          type: string
          format: date-time
          readOnly: true
        events:
