  /api/v1/payments/webhooks/{provider}/:
    post:
      operationId: payments_webhooks_create
      description: Called by the payment provider. The signature header is verified
        against the configured webhook secret; unsigned or tampered requests get 400
        and change nothing. Each provider event id is processed once.
