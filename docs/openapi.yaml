            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not logged in (`not_authenticated`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Wrong role or CSRF failure (`permission_denied`, `csrf_failed`).
    post:
      operationId: bookings_create
      description: |-
        Creates a booking for an open slot (see `GET /mentors/{id}/availability/`). The slot is re-validated inside a transaction; overlapping bookings are rejected by the database.

        * Free services → `requested` (or `confirmed` if the mentor auto-accepts).
        * Paid services → `pending_payment`, held for `BOOKING_HOLD_MINUTES`. It only advances when the payment provider confirms payment server-side (not yet available: holds expire).
      summary: Book a session
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '400':
