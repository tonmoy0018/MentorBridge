          description: Not logged in (`not_authenticated`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Wrong role or CSRF failure (`permission_denied`, `csrf_failed`).
        '404':
